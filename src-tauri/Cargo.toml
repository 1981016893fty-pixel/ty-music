[package]
name = "ty-music"
version = "1.0.0"
description = "TY Music desktop client"
authors = ["TY Music"]
edition = "2021"

[lib]
name = "ty_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
mediaplayer = "0.4.3"
base64 = "0.22"

[features]
custom-protocol = ["tauri/custom-protocol"]

[patch.crates-io]
mediaplayer = { path = "vendor/mediaplayer" }
