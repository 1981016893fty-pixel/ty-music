<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Colorful music listener</title>
  <desc id="desc">An energetic person wearing headphones surrounded by vivid sound waves.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1027a8"/><stop offset=".34" stop-color="#7b1fc9"/><stop offset=".7" stop-color="#ef3d8f"/><stop offset="1" stop-color="#ff9f1c"/>
    </linearGradient>
    <radialGradient id="glowC" cx=".2" cy=".3" r=".7"><stop stop-color="#00f0ff" stop-opacity=".9"/><stop offset="1" stop-color="#00f0ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowY" cx=".8" cy=".7" r=".75"><stop stop-color="#ffe600" stop-opacity=".8"/><stop offset="1" stop-color="#ffe600" stop-opacity="0"/></radialGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00e5ff"/><stop offset=".5" stop-color="#62ff78"/><stop offset="1" stop-color="#ffe600"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffcb9a"/><stop offset="1" stop-color="#f47c72"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#09002c" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
