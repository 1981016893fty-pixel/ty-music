services:
  - type: web
    name: ty-music
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm test && npm run build:aurora
    startCommand: node server-simple.js
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: GD_EMBEAT_CONNECT_HOST
        value: music-api.gdstudio.xyz
