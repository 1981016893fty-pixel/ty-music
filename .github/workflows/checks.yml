name: Web checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:aurora
      - name: Check committed bundles
        run: git diff --exit-code -- soft-aurora-react.js soft-aurora-react.css
