name: Build macOS Desktop App

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/macos-desktop.yml'
      - 'desktop/**'
      - 'src-tauri/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'player.js'
      - 'soft-aurora-react.css'
      - 'soft-aurora-react.js'
      - 'style.css'

permissions:
  contents: write

jobs:
  build:
    name: macOS installer
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Build DMG installer
        run: npm run desktop:build
      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: TY-Music-macOS-installer
          if-no-files-found: error
          path: src-tauri/target/release/bundle/dmg/*.dmg
      - name: Publish macOS installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: src-tauri/target/release/bundle/dmg/*.dmg
