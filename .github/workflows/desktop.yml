name: Desktop installers

on:
  workflow_dispatch:
  pull_request:
    paths: &desktop_paths
      - '.github/workflows/desktop.yml'
      - 'desktop/**'
      - 'src-tauri/**'
      - 'docs/releases/**'
      - 'assets/**'
      - 'vendor/**'
      - '*.html'
      - '*.js'
      - '*.css'
      - '*.json'
      - '*.png'
      - '*.svg'
  push:
    branches: [main]
    tags: ['v*']
    paths: *desktop_paths

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} installers
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-15
            command: desktop:build
            files: src-tauri/target/release/bundle/dmg/*.dmg
          - platform: Windows
            os: windows-latest
            command: desktop:build:windows
            files: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish complete desktop release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: installers
          merge-multiple: true
      - name: Verify tag and publish all three installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$GITHUB_REF_NAME" == "v$version" ]]
          [[ "$(node -p 'require("./src-tauri/tauri.conf.json").version')" == "$version" ]]
          mkdir release-assets
          for suffix in aarch64.dmg x64-setup.exe x64_en-US.msi; do
            filename="TY Music_${version}_${suffix}"
            mapfile -t matches < <(find installers -type f -name "$filename")
            [[ "${#matches[@]}" == 1 && -s "${matches[0]}" ]]
            cp "${matches[0]}" "release-assets/TY.Music_${version}_${suffix}"
          done
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "TY Music $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" release-assets/*
